name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Limit CI permissions to read-only — prevents token abuse if a step is compromised
permissions:
  contents: read

jobs:
  skillgen-check:
    # Validates that graphify/skill*.md and graphify/always_on/*.md are in sync
    # with the fragments in tools/skillgen/. Only runs when those source files
    # actually change — not on every commit — because LuaAccess/Grafify is a
    # hardened fork (not an active skillgen development repo) and unrelated commits
    # (marketplace.json, pyproject.toml, .github/ changes) should not be blocked
    # by a generator drift check they cannot affect.
    runs-on: ubuntu-latest
    # ── PATH FILTER ──────────────────────────────────────────────────────────
    # Only run when files that can cause skillgen drift are touched:
    #   tools/skillgen/**        → fragment source or generator code changed
    #   graphify/skill*.md       → generated skill file edited directly
    #   graphify/always_on/**    → always-on instruction blocks changed
    # All other commits (docs, CI config, pyproject, marketplace, etc.) skip
    # this job entirely so they never fail on unrelated drift.
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.modified), 'tools/skillgen') ||
      contains(toJSON(github.event.commits.*.modified), 'graphify/skill') ||
      contains(toJSON(github.event.commits.*.modified), 'graphify/always_on') ||
      contains(toJSON(github.event.commits.*.added),    'tools/skillgen') ||
      contains(toJSON(github.event.commits.*.added),    'graphify/skill') ||
      contains(toJSON(github.event.commits.*.added),    'graphify/always_on')
    steps:
      # SHA-pinned: actions/checkout v4.2.2 — avoids tag-mutable supply chain risk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # SHA-pinned: astral-sh/setup-uv v5.4.2
      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4b4b9a0e5f03bd1e5f
        with:
          python-version: "3.12"

      - name: Check generated skill artifacts are up to date
        run: uv run --frozen python -m tools.skillgen --check

      - name: Audit per-host v8 coverage
        run: uv run --frozen python -m tools.skillgen --audit-coverage

      - name: Check the file_type enum is a singleton
        run: uv run --frozen python -m tools.skillgen --schema-singleton

      - name: Round-trip the monoliths against v8
        run: uv run --frozen python -m tools.skillgen --monolith-roundtrip

      - name: Round-trip the always-on blocks against v8
        run: uv run --frozen python -m tools.skillgen --always-on-roundtrip

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      # SHA-pinned: actions/checkout v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # SHA-pinned: astral-sh/setup-uv v5.4.2
      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4b4b9a0e5f03bd1e5f
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run --frozen pytest tests/ -q --tb=short

      - name: Verify install works end-to-end
        run: |
          uv run --frozen graphify --help
          uv run --frozen graphify install
